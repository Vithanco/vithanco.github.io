59" text-anchor="start" fill="#ffffff" font-size="11" font-family="'DM Sans', Helvetica, sans-serif" font-weight="600" opacity="0.85" letter-spacing="0.07em">«SOFTWARE SYSTEM»</text><text x="79.883" y="45.099999999999994" text-anchor="middle" fill="#ffffff" font-size="13" font-family="'DM Sans', Helvetica, sans-serif">Internet</text><text x="79.883" y="60.699999999999996" text-anchor="middle" fill="#ffffff" font-size="13" font-family="'DM Sans', Helvetica, sans-serif">Banking</text><text x="79.883" y="76.3" text-anchor="middle" fill="#ffffff" font-size="13" font-family="'DM Sans', Helvetica, sans-serif">System</text></g></g><g id="node-ses" class="vgraph-node"><g transform="translate(200.05,204.97000000000003)"><rect x="0" y="0" width="165.9" height="72.7" rx="9" fill="#c62828"/><rect x="0.7500000000000001" y="0.7500000000000001" width="164.4" height="71.2" rx="9" fill="none" stroke="#c62828" stroke-width="1.5"/><text x="12.75" y="22.59" text-anchor="start" fill="#ffffff" font-size="11" font-family="'DM Sans', Helvetica, sans-serif" font-weight="600" opacity="0.85" letter-spacing="0.07em">«SOFTWARE SYSTEM»</text><text x="82.95" y="45.099999999999994" text-anchor="middle" fill="#ffffff" font-size="13" font-family="'DM Sans', Helvetica, sans-serif">Amazon Web Services</text><text x="82.95" y="60.699999999999996" text-anchor="middle" fill="#ffffff" font-size="13" font-family="'DM Sans', Helvetica, sans-serif">Simple Email Service</text></g></g><g id="node-customer" class="vgraph-node"><g transform="translate(299.408,330.57)"><rect x="0" y="18.7" width="87.184" height="84.8" rx="9" fill="#08427b"/><circle cx="43.592" cy="11" r="11" fill="#08427b"/><text x="12" y="38.54" text-anchor="start" fill="#ffffff" font-size="11" font-family="'DM Sans', Helvetica, sans-serif" font-weight="600" opacity="0.85" letter-spacing="0.07em">«PERSON»</text><text x="43.592" y="61.05" text-anchor="middle" fill="#ffffff" font-size="13" font-family="'DM Sans', Helvetica, sans-serif">Personal</t
svg:has(#node-ses:hover) #edge-100007,svg:has(#node-ses:hover) #edge-100023,svg:has(#node-ses:hover) #node-customer,svg:has(#node-ses:hover) #group-ibs{opacity:1;filter:drop-shadow(0 0 8px rgba(59,130,246,0.9));}
svg:has(#node-ses:hover) #edge-100007 path,svg:has(#node-ses:hover) #edge-100023 path{stroke:#3b82f6;stroke-width:3;}
svg:has(#node-ses:hover) #edge-100007 polygon,svg:has(#node-ses:hover) #edge-100007 ellipse,svg:has(#node-ses:hover) #edge-100007 circle,svg:has(#node-ses:hover) #edge-100023 polygon,svg:has(#node-ses:hover) #edge-100023 ellipse,svg:has(#node-ses:hover) #edge-100023 circle{fill:#3b82f6;stroke:#3b82f6;}
svg:has(#group-ibs:hover) #edge-bundle__customer__ibs,svg:has(#group-ibs:hover) #edge-100023,svg:has(#group-ibs:hover) #edge-100031,svg:has(#group-ibs:hover) #node-customer,svg:has(#group-ibs:hover) #node-ses,svg:has(#group-ibs:hover) #node-cbs{opacity:1;filter:drop-shadow(0 0 8px rgba(59,130,246,0.9));}
svg:has(#group-ibs:hover) #edge-bundle__customer__ibs path,svg:has(#group-ibs:hover) #edge-100023 path,svg:has(#group-ibs:hover) #edge-100031 path{stroke:#3b82f6;stroke-width:3;}
svg:has(#group-ibs:hover) #edge-bundle__customer__ibs polygon,svg:has(#group-ibs:hover) #edge-bundle__customer__ibs ellipse,svg:has(#group-ibs:hover) #edge-bundle__customer__ibs circle,svg:has(#group-ibs:hover) #edge-100023 polygon,svg:has(#group-ibs:hover) #edge-100023 ellipse,svg:has(#group-ibs:hover) #edge-100023 circle,svg:has(#group-ibs:hover) #edge-100031 polygon,svg:has(#group-ibs:hover) #edge-100031 ellipse,svg:has(#group-ibs:hover) #edge-100031 circle{fill:#3b82f6;stroke:#3b82f6;}
svg:has(#edge-bundle__customer__ibs:hover) #node-customer,svg:has(#edge-bundle__customer__ibs:hover) #group-ibs{opacity:1;filter:drop-shadow(0 0 8px rgba(59,130,246,0.9));}

<svg width="506.0" height="797.4799999999999" viewBox="-50.0 -50.0 506.0 797.4799999999999" xmlns="http://www.w3.org/2000/svg"><metadata><vithanco:vgl xmlns:vithanco="https://vithanco.com/ns/vgl" version="1"><![CDATA[vgraph c4Elements: C4 "The C4 element types" {
    node person: Person "Person";

    group org: Organisation "Organisation" {
        node extSystem: SoftwareSystem "SoftwareSystem (external)" [backgroundColor: "#999999"];

        group system: SoftwareSystem "SoftwareSystem" {
            isfolded: false;
            node app: Container "Container";
            node database: Database "Database";

            group service: Container "Container, opened up" {
                isfolded: false;
                node plain: Component "Component";

                group component: Component "Component, opened up" {
                    isfolded: false;
                    node code: CodeElement "CodeElement";
                };
            };
        };
    };

    edge person -> app "Uses";
    edge app -> plain "Calls";
    edge plain -> code "Calls";
    edge code -> database "Reads from and writes to";
    edge app -> extSystem "Depends on";
}]]></vithanco:vgl></metadata><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap');</style><style>.vgraph-node, .vgraph-edge, .vgraph-group > rect { transition: opacity 0.12s ease-out, filter 0.12s ease-out; }

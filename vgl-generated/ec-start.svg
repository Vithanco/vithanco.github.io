<svg width="679.6" height="324.6" viewBox="-50.0 -50.0 679.6 324.6" xmlns="http://www.w3.org/2000/svg"><metadata><vithanco:vgl xmlns:vithanco="https://vithanco.com/ns/vgl" version="1"><![CDATA[vgraph ecStart: EC "The Evaporating Cloud's basic structure" {
    node obj: CommonObjective "Shared Objective";
    node needA: Need "What one side needs";
    node wantA: Want "What one side wants";
    node needB: Need "What the other side needs";
    node wantB: Want "What the other side wants";
    node conf: Conflict;
    edge obj -> needA: objective_to_need;
    edge obj -> needB: objective_to_need;
    edge needA -> wantA: need_to_want;
    edge needB -> wantB: need_to_want;
    edge wantA -> conf: want_to_conflict;
    edge wantB -> conf: want_to_conflict;
}]]></vithanco:vgl></metadata><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap');</style><style>.vgraph-node, .vgraph-edge, .vgraph-group > rect { transition: opacity 0.12s ease-out, filter 0.12s ease-out; }

    node q: Question "Should Vithanco be open source?";
    node yes: Answer "Yes, under Apache 2.0";
    node no: Answer "No, keep it closed";
    node reach: Pro "Anyone can use it, for free";
    node help: Pro "Others can build notations and the editor";
    node income: Con "No licence income";
    node hidden: Con "Few people would ever find it";
    edge q -> yes;
    edge q -> no;
    edge yes -> reach;
    edge yes -> help;
    edge yes -> income;
    edge no -> hidden;
}]]></vithanco:vgl></metadata><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap');</style><style>.vgraph-node, .vgraph-edge, .vgraph-group > rect { transition: opacity 0.12s ease-out, filter 0.12s ease-out; }
